# Sprintify 엔진이 이 저장소를 검증할 때 쓰는 명령. 엔진은 이 파일을 기준 커밋(기본 브랜치 main)에서 읽는다.
# 작업 브랜치에서 고쳐도 반영되지 않는다.
#
# 검증 컨테이너에는 바깥 네트워크가 없다(프록시 허용 목록에 Maven Central·Google·Pleos 저장소가 없음).
# 의존성은 이미지(.sprintify/agent.Dockerfile, projects.container_image)에 미리 받아 두었으므로 Gradle 은 반드시 --offline 으로 돈다.
# 새 의존성이 필요하면 이미지를 다시 빌드한다. 에뮬레이터는 없으므로 실행 확인이 필요한 기준은 manual 로 둔다.
typecheck: "cd poc && ./gradlew --offline --no-daemon -q assembleDebug"
test: "cd poc && ./gradlew --offline --no-daemon -q testDebugUnitTest && python3 ../.sprintify/merge_junit.py . $SPRINTIFY_OUT/junit.xml"
report: junit
